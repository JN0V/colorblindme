name: check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Translation catalogues are in sync
        run: python3 scripts/check_i18n.py
      - name: Page keys and selectors resolve
        run: python3 scripts/check_ui.py

  # Skipped while the repository is private: Pages needs a paid plan there, and
  # a job that fails on every push trains people to ignore the red cross. This
  # starts working by itself the day the repository is made public.
  deploy:
    needs: check
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
