<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colorblind Me</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="src/ui/viewer.css">
</head>
<body>

<main class="home">
  <p class="note" id="unreviewed" data-i18n="i18n.unreviewed" hidden></p>

  <h1 class="hero" data-i18n="app.tagline"></h1>
  <p class="lead" data-i18n="app.intro"></p>

  <div class="doors">
    <a class="door" href="measure.html">
      <span class="door-ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="3"></circle></svg></span>
      <span class="door-kick" data-i18n="door.measure.kicker"></span>
      <span class="door-title" data-i18n="door.measure.title"></span>
      <span class="door-desc" data-i18n="door.measure.desc"></span>
      <span class="door-cta"><span data-i18n="door.cta"></span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg></span>
    </a>
    <a class="door amber" href="view.html">
      <span class="door-ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg></span>
      <span class="door-kick" data-i18n="door.view.kicker"></span>
      <span class="door-title" data-i18n="door.view.title"></span>
      <span class="door-desc" data-i18n="door.view.desc"></span>
      <span class="door-cta"><span data-i18n="door.cta"></span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg></span>
    </a>
  </div>
</main>

<footer style="max-width:980px;margin:0 auto;padding:18px">
  <p style="margin:0" data-i18n="app.privacy"></p>
  <div class="langs">
    <label for="lang" data-i18n="app.language"></label>
    <select id="lang"></select>
  </div>
</footer>

<script type="module" src="src/ui/home.js"></script>
</body>
</html>
